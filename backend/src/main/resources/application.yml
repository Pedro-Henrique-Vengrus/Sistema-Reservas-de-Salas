server:
  port: 8080

spring:
  application:
    name: campusflow
  datasource:
    url: jdbc:postgresql://localhost:5432/campusflow
    username: campusflow
    password: campusflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # SMTP institucional. Sem host configurado nada e enviado (ver app.email.enabled).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Configuracoes da aplicacao
app:
  email:
    # Desligado por padrao: sem SMTP configurado o sistema apenas registra o aviso em log.
    # Ligue com EMAIL_ENABLED=true depois de apontar SMTP_HOST.
    enabled: ${EMAIL_ENABLED:false}
    remetente: ${EMAIL_FROM:nao-responda@campusflow.unifil.br}
  jwt:
    # Em producao, mova para variavel de ambiente. Minimo 256 bits para HS256.
    secret: ${JWT_SECRET:campusflow-dev-secret-key-change-me-in-production-256bits-minimum}
    # Access token curto: 1 hora (em ms)
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    org.springframework.security: INFO
